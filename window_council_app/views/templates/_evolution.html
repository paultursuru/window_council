<section class="evolution" id="evolution">
  <h2>Évolution</h2>
  <div class="ranges" role="group" aria-label="Période affichée">
    <button type="button" data-h="3">3 h</button>
    <button type="button" data-h="24">24 h</button>
    <button type="button" data-h="168">7 jours</button>
  </div>
  <figure class="chart">
    <figcaption><b>Température</b>
      <span><i class="key indoor"></i>Intérieur (● relevés)</span>
      <span><i class="key outdoor"></i>Extérieur</span>
      <span><i class="key target"></i>Cible</span>
      <span><i class="key ideal"></i>Idéal</span>
      <span><i class="key airing"></i>Fenêtres ouvertes</span></figcaption>
    <div class="plot" id="plot-temp" tabindex="0" role="img" aria-label="Température intérieure et extérieure"></div>
  </figure>
  <figure class="chart">
    <figcaption><b>Humidité relative</b>
      <span><i class="key indoor"></i>Intérieur (● relevés)</span>
      <span><i class="key outdoor"></i>Air extérieur ramené à la température intérieure</span>
      <span><i class="key target"></i>Cible</span>
      <span><i class="key ideal"></i>Idéal</span>
      <span><i class="key airing"></i>Fenêtres ouvertes</span></figcaption>
    <div class="plot" id="plot-rh" tabindex="0" role="img" aria-label="Humidité intérieure et humidité projetée de l'air extérieur"></div>
  </figure>
  <div class="tip" id="tip" hidden></div>
  <h3>Relevés de l'hygromètre</h3>
  <p class="sub">Heure de chaque relevé, état des fenêtres à partir de là, et vitesse de variation depuis le précédent.</p>
  <div class="scroll"><table id="entries"></table></div>
  <details>
    <summary>Tous les passages du plugin sur la période</summary>
    <div class="scroll"><table id="runs"></table></div>
  </details>
  <noscript><p class="sub">Le graphique a besoin de JavaScript ; les données sont dans report.json.</p></noscript>
</section>
